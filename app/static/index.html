<!doctype html><html><head><meta charset="utf-8"><style>body{font:16px system-ui;max-width:850px;margin:60px auto;padding:20px;color:#172033}h1{font-size:3rem}input,select{padding:14px;border:1px solid #bbc5d4}input{width:60%}button{padding:14px;background:#2563eb;color:white;border:0}.result{padding:20px 0;border-bottom:1px solid #ddd}.result h2{color:#164ead;margin:0}.meta{color:#667085}mark{background:#fef08a}</style></head><body><h1>Documentation Search</h1><input id="q" value="persist container data"><select id="cat"><option value="">All categories</option></select><button id="go">Search</button><div id="results"></div><script>async function run(){const d=await fetch(`/search?q=${encodeURIComponent(q.value)}&category=${encodeURIComponent(cat.value)}`).then(r=>r.json());if(cat.options.length==1)d.facets.forEach(x=>cat.add(new Option(x,x)));results.innerHTML=d.results.map(x=>`<article class="result"><h2>${x.title}</h2><div class="meta">${x.category} · ${x.section}</div><p>${x.snippet}</p></article>`).join('')}go.onclick=run;run()</script></body></html>
